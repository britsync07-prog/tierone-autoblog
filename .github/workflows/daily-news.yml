name: daily-news-publish

on:
  schedule:
    # Daily at 06:00 UTC (Plan 07-04, D-01, NEWS-04)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish even if published today'
        required: false
        default: 'false'
      dry_run:
        description: 'Dry run without publishing or writing files'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Daily News Publisher
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_MODEL_CHEAP: ${{ secrets.LLM_MODEL_CHEAP }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://exclusivesources.online' }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          npx tsx scripts/publish-daily-news.ts $FLAGS

      - name: Commit and push published content updates
        run: |
          if [ -n "$(git status --porcelain content/ public/images/)" ]; then
            git add content/ public/images/
            git commit -m "publish(news): daily automated tech news release"
            git push origin master
          else
            echo "No news published or changes to commit."
          fi

      - name: Deploy to Cloudflare Pages (if credentials provided)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build
          node scripts/prepare-pages.mjs
          npx wrangler pages deploy deploy-pages --project-name tierone-autoblog --branch master
