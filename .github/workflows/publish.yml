name: publish

on:
  schedule:
    # 4x per week: Monday, Wednesday, Friday, Sunday at 06:00 UTC (Plan 05-02, D-01)
    - cron: '0 6 * * 1,3,5,0'
  workflow_dispatch:
    inputs:
      force_candidate_id:
        description: 'Force specific keyword ID'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scheduled publisher
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://exclusivesources.online' }}
        run: npx tsx scripts/publish-scheduled.ts ${{ github.event.inputs.force_candidate_id }}

      - name: Commit and push published content updates
        run: |
          if [ -n "$(git status --porcelain content/ public/images/)" ]; then
            git add content/ public/images/
            git commit -m "publish: automated release"
            git push origin master
          else
            echo "No changes to commit."
          fi

      - name: Deploy to Cloudflare Pages (if credentials provided)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build
          node scripts/prepare-pages.mjs
          npx wrangler pages deploy deploy-pages --project-name tierone-autoblog-git --branch master
